<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>BromeoRemote chat</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #0f172a;
    }
    .shell { width: 100%; height: 100%; padding: 8px; }
    .panel {
      height: 100%;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(31, 94, 234, 0.3);
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.32);
    }
    .head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      background: linear-gradient(135deg, #1f5eea 0%, #2144c9 100%);
      color: #fff;
      font-weight: 800;
      font-size: 12.5px;
    }
    .head span { flex: 1; }
    .head button {
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 6px;
      background: rgba(255,255,255,0.16);
      color: #fff;
      font: inherit;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
    }
    .head button:hover { background: rgba(255,255,255,0.28); }
    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #f7faff;
    }
    .empty { margin: auto; color: #94a3b8; font-size: 12px; text-align: center; }
    .bubble {
      max-width: 82%;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 12.5px;
      line-height: 1.35;
      background: #fff;
      border: 1px solid #dbe5f5;
      align-self: flex-start;
      word-break: break-word;
    }
    .bubble.mine {
      align-self: flex-end;
      background: linear-gradient(180deg, #2f6fed 0%, #1f5eea 100%);
      color: #fff;
      border-color: transparent;
    }
    .bubble time {
      display: block;
      margin-top: 3px;
      font-size: 9.5px;
      opacity: 0.65;
    }
    .composer {
      display: flex;
      gap: 6px;
      padding: 8px;
      border-top: 1px solid #dbe5f5;
      background: #fff;
    }
    .composer input {
      flex: 1;
      min-width: 0;
      height: 32px;
      padding: 0 9px;
      border: 1px solid #cad8ef;
      border-radius: 7px;
      font: inherit;
      font-size: 12.5px;
    }
    .composer input:focus { outline: none; border-color: #2f6fed; }
    .composer button {
      height: 32px;
      padding: 0 12px;
      border: 1px solid #1f5eea;
      border-radius: 7px;
      background: linear-gradient(180deg, #2f6fed 0%, #1f5eea 100%);
      color: #fff;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel">
      <header class="head">
        <span>Chat</span>
        <button id="chat-close" title="Sluiten">×</button>
      </header>
      <div id="chat-messages" class="messages"><div class="empty">Nog geen berichten</div></div>
      <div class="composer">
        <input id="chat-input" type="text" placeholder="Typ een bericht…" />
        <button id="chat-send">Sturen</button>
      </div>
    </section>
  </div>
  <script type="module" src="./host-chat.js"></script>
</body>
</html>
