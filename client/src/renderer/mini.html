<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>BromeoRemote sessiebediening</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #0f172a;
    }
    .shell {
      width: 100%;
      height: 100%;
      padding: 8px;
    }
    .panel {
      height: 100%;
      border: 1px solid rgba(47, 111, 237, 0.28);
      border-radius: 10px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 18px 46px rgba(15, 23, 42, 0.28);
    }
    .head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: linear-gradient(135deg, #1f5eea 0%, #2847d8 100%);
      color: #fff;
      -webkit-app-region: drag;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.28);
      font-weight: 900;
    }
    .title { min-width: 0; flex: 1; }
    .title strong {
      display: block;
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .title span {
      display: block;
      margin-top: 1px;
      opacity: 0.86;
      font-size: 11.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .open {
      -webkit-app-region: no-drag;
      height: 28px;
      padding: 0 9px;
      border: 1px solid rgba(255,255,255,0.34);
      border-radius: 7px;
      background: rgba(255,255,255,0.14);
      color: #fff;
      font: inherit;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .body { padding: 12px; }
    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .meta-box {
      min-width: 0;
      padding: 8px 9px;
      border: 1px solid #dbe5f5;
      border-radius: 8px;
      background: #f7faff;
    }
    .meta-box span {
      display: block;
      color: #64748b;
      font-size: 9.5px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .meta-box strong {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    button.action {
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid #cad8ef;
      border-radius: 8px;
      background: linear-gradient(180deg, #fff 0%, #f3f7ff 100%);
      color: #1e3a5f;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    button.action:hover { border-color: #2f6fed; color: #2f6fed; }
    button.action:disabled { opacity: 0.45; cursor: not-allowed; }
    button.danger {
      border-color: #dc3545;
      background: linear-gradient(180deg, #ef4052 0%, #dc3545 100%);
      color: #fff;
    }
    button.wide { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel">
      <header class="head">
        <div class="mark">BR</div>
        <div class="title">
          <strong id="mini-peer">BromeoRemote sessie</strong>
          <span id="mini-status">Verbonden</span>
        </div>
        <button id="mini-open" class="open">Open</button>
      </header>
      <div class="body">
        <div class="meta">
          <div class="meta-box"><span>Rechten</span><strong id="mini-permissions">-</strong></div>
          <div class="meta-box"><span>Scherm</span><strong id="mini-screen">Aan</strong></div>
        </div>
        <div class="actions">
          <button id="mini-clipboard" class="action">Klembord</button>
          <button id="mini-chat" class="action">Chat</button>
          <button id="mini-screen-toggle" class="action">Scherm uit</button>
          <button id="mini-end" class="action danger">Beëindigen</button>
          <button id="mini-panic" class="action wide">Beëindigen + wachtwoord wijzigen</button>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="./mini.js"></script>
</body>
</html>
