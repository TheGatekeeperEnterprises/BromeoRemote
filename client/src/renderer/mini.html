<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>BromeoRemote sessiebediening</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #0f172a;
    }
    .shell {
      width: 100%;
      height: 100%;
      padding: 8px;
    }
    .panel {
      height: 100%;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(31, 94, 234, 0.3);
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.32);
    }
    .head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 10px 10px 12px;
      background: linear-gradient(135deg, #1f5eea 0%, #2144c9 100%);
      color: #fff;
      -webkit-app-region: drag;
    }
    .mark {
      position: relative;
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.28);
      font-weight: 900;
      font-size: 11px;
    }
    .mark .live-dot {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      border: 1.5px solid #1f5eea;
    }
    .title { min-width: 0; flex: 1; }
    .title strong {
      display: block;
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .title span {
      display: block;
      margin-top: 1px;
      opacity: 0.86;
      font-size: 11.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .head-btn {
      -webkit-app-region: no-drag;
      flex-shrink: 0;
      height: 26px;
      padding: 0 8px;
      border: 1px solid rgba(255,255,255,0.34);
      border-radius: 7px;
      background: rgba(255,255,255,0.14);
      color: #fff;
      font: inherit;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .head-btn:hover { background: rgba(255,255,255,0.26); }
    .collapse-btn {
      width: 26px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 13px;
    }
    .body { padding: 12px; overflow-y: auto; overflow-x: hidden; }
    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .meta-box {
      min-width: 0;
      padding: 8px 9px;
      border: 1px solid #dbe5f5;
      border-radius: 8px;
      background: #f7faff;
    }
    .meta-box span {
      display: block;
      color: #64748b;
      font-size: 9.5px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .meta-box strong {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    button.action {
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid #cad8ef;
      border-radius: 8px;
      background: linear-gradient(180deg, #fff 0%, #f3f7ff 100%);
      color: #1e3a5f;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    button.action:hover { border-color: #2f6fed; color: #2f6fed; }
    button.action:disabled { opacity: 0.45; cursor: not-allowed; }
    button.action.active {
      border-color: #1f5eea;
      background: linear-gradient(180deg, #2f6fed 0%, #1f5eea 100%);
      color: #fff;
    }
    button.danger {
      border-color: #dc3545;
      background: linear-gradient(180deg, #ef4052 0%, #dc3545 100%);
      color: #fff;
    }
    button.wide { grid-column: 1 / -1; }
    .viewer-list {
      max-height: 92px;
      overflow-y: auto;
      margin-bottom: 10px;
      border: 1px solid #dbe5f5;
      border-radius: 8px;
      background: #f7faff;
    }
    .viewer-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-bottom: 1px solid #e5edf9;
    }
    .viewer-row:last-child { border-bottom: none; }
    .viewer-row .viewer-name {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .viewer-row .viewer-perm {
      font-size: 9.5px;
      color: #64748b;
      white-space: nowrap;
    }
    .viewer-row .viewer-kick,
    .viewer-row .viewer-promote {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
    }
    .viewer-row .viewer-kick:hover { background: #fde8ea; color: #dc3545; }
    .viewer-row .viewer-promote:hover { background: #e5f0ff; color: #2f6fed; }

    /* Collapsed edge tab — TeamViewer-style slide-to-edge minimize. Swapped
       in via body.collapsed; the actual window itself is shrunk to match
       by main.ts (toggleMiniControllerCollapse), so this just has to fill
       whatever tiny bounds it's given. */
    .tab {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border-radius: 12px 0 0 12px;
      background: linear-gradient(135deg, #1f5eea 0%, #2144c9 100%);
      color: #fff;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.32);
      cursor: pointer;
    }
    .tab-mark {
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.3);
      font-size: 8.5px;
      font-weight: 900;
      letter-spacing: 0.2px;
    }
    .tab-arrow {
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
    }
    body.collapsed .panel { display: none; }
    body.collapsed .tab { display: flex; }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel">
      <header class="head">
        <div class="mark">BR<span class="live-dot"></span></div>
        <div class="title">
          <strong id="mini-peer">BromeoRemote sessie</strong>
          <span id="mini-status">Verbonden</span>
        </div>
        <button id="mini-open" class="head-btn">Open</button>
        <button id="mini-collapse" class="head-btn collapse-btn" title="Inklappen">«</button>
      </header>
      <div class="body">
        <div id="mini-viewer-list" class="viewer-list"></div>
        <div class="meta">
          <div class="meta-box"><span>Scherm</span><strong id="mini-screen">Aan</strong></div>
        </div>
        <div class="actions">
          <button id="mini-clipboard" class="action">Klembord</button>
          <button id="mini-chat" class="action">Chat</button>
          <button id="mini-screen-toggle" class="action">Scherm uit</button>
          <button id="mini-whiteboard" class="action">Whiteboard</button>
          <button id="mini-end" class="action danger wide">Alles beëindigen</button>
          <button id="mini-panic" class="action wide">Beëindigen + wachtwoord wijzigen</button>
        </div>
      </div>
    </section>
    <div id="mini-tab" class="tab" title="Uitklappen">
      <span class="tab-mark">BR</span>
      <span class="tab-arrow">›</span>
    </div>
  </div>
  <script type="module" src="./mini.js"></script>
</body>
</html>
