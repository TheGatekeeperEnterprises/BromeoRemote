<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>BromeoRemote whiteboard</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    body.tool-select { cursor: default; }
    body.tool-pen, body.tool-highlighter, body.tool-rect, body.tool-ellipse, body.tool-text, body.tool-comment { cursor: crosshair; }
    body.tool-eraser { cursor: cell; }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .toolbar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      cursor: default;
    }
    .tools-row, .actions-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tool-btn {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer;
    }
    .tool-btn svg { width: 17px; height: 17px; }
    .tool-btn:hover { background: rgba(255, 255, 255, 0.1); }
    .tool-btn.active { background: rgba(47, 111, 237, 0.35); border-color: #2f6fed; color: #fff; }
    .sep { width: 1px; align-self: stretch; margin: 4px 2px; background: rgba(255, 255, 255, 0.16); }
    .color-btn {
      width: 20px;
      height: 20px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
    }
    .color-btn.active { border-color: #fff; }
    .actions-row .hint {
      color: rgba(255, 255, 255, 0.62);
      font-size: 11.5px;
      font-weight: 600;
      padding: 0 4px;
      white-space: nowrap;
      flex: 1;
    }
    .actions-row button.text-btn {
      height: 26px;
      padding: 0 10px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font: inherit;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .actions-row button.text-btn:hover { background: rgba(255, 255, 255, 0.18); }
    .actions-row button.close {
      background: linear-gradient(180deg, #ef4052 0%, #dc3545 100%);
      border-color: #dc3545;
    }
    .text-input {
      position: absolute;
      min-width: 140px;
      padding: 4px 6px;
      border: 1.5px dashed rgba(255, 255, 255, 0.7);
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.55);
      color: #fff;
      font: 600 15px "Segoe UI", Arial, sans-serif;
      outline: none;
    }
  </style>
</head>
<body class="tool-pen">
  <canvas id="canvas"></canvas>
  <div class="toolbar">
    <div class="tools-row">
      <button class="tool-btn" data-tool="select" title="Selecteren">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 8-6 2-2 6z" /></svg>
      </button>
      <button class="tool-btn active" data-tool="pen" title="Pen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1z" /></svg>
      </button>
      <button class="tool-btn" data-tool="highlighter" title="Markeerstift">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l4 4-6 5-3-3 5-6z" /><path d="M9 11l7-8 5 5-8 7" /></svg>
      </button>
      <button class="tool-btn" data-tool="eraser" title="Gum">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10" width="14" height="8" rx="1.5" transform="rotate(-20 12 14)" /></svg>
      </button>
      <button class="tool-btn" data-tool="rect" title="Rechthoek">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="1.5" /></svg>
      </button>
      <button class="tool-btn" data-tool="ellipse" title="Ellips">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="8" ry="6" /></svg>
      </button>
      <button class="tool-btn" data-tool="text" title="Tekst">Aa</button>
      <button class="tool-btn" data-tool="comment" title="Notitie">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v10H9l-4 4V5z" /></svg>
      </button>
      <span class="sep"></span>
      <button class="color-btn active" data-color="#ff3b3b" style="background:#ff3b3b" title="Rood"></button>
      <button class="color-btn" data-color="#ffd60a" style="background:#ffd60a" title="Geel"></button>
      <button class="color-btn" data-color="#2f6fed" style="background:#2f6fed" title="Blauw"></button>
      <button class="color-btn" data-color="#22c55e" style="background:#22c55e" title="Groen"></button>
      <button class="color-btn" data-color="#0f172a" style="background:#0f172a" title="Zwart"></button>
    </div>
    <div class="actions-row">
      <span class="hint">Whiteboard — sleep om te tekenen</span>
      <button id="save-btn" class="text-btn">Opslaan</button>
      <button id="clear-btn" class="text-btn">Wissen</button>
      <button id="close-btn" class="text-btn close">Sluiten</button>
    </div>
  </div>
  <script type="module" src="./host-annotate.js"></script>
</body>
</html>
