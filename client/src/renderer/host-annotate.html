<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>BromeoRemote whiteboard</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      cursor: crosshair;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .toolbar {
      position: absolute;
      top: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      cursor: default;
    }
    .toolbar .hint {
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      font-weight: 600;
      padding: 0 6px;
      white-space: nowrap;
    }
    .toolbar button {
      height: 30px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .toolbar button:hover { background: rgba(255, 255, 255, 0.18); }
    .toolbar button.close {
      background: linear-gradient(180deg, #ef4052 0%, #dc3545 100%);
      border-color: #dc3545;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="toolbar">
    <span class="hint">Whiteboard — sleep om te tekenen</span>
    <button id="clear-btn">Wissen</button>
    <button id="close-btn" class="close">Sluiten</button>
  </div>
  <script type="module" src="./host-annotate.js"></script>
</body>
</html>
