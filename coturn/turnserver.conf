# BromeoRemote TURN relay (coturn). See docs/DEPLOY.md section 2.
#
# Deployed as its own Coolify resource (Docker Compose build pack, base
# directory /coturn) rather than the systemd/apt route docs/DEPLOY.md
# originally described, since this project's infra runs on Coolify.

listening-port=3478
min-port=49152
max-port=49252

# This host is behind NAT (home network, port-forwarded to a public IP) —
# without this, coturn would tell clients to relay through its private LAN
# address, which is unreachable from outside. Format: public-ip/private-ip.
external-ip=62.45.93.36/192.168.1.20

realm=bromeoremote.com
lt-cred-mech
user=bromeo:pvyht0ejbJigBjAzTI6IVFJ0GGYVH29h
no-cli
no-tls
no-dtls
