# BromeoRemote TURN relay (coturn). See docs/DEPLOY.md section 2.
#
# Deployed as its own Coolify resource (Docker Compose build pack, base
# directory /coturn) rather than the systemd/apt route docs/DEPLOY.md
# originally described, since this project's infra runs on Coolify.

listening-port=3478
min-port=49152
max-port=65535
# The relay-port firewall rule (VPS ufw + Hostinger panel) MUST cover this
# same 49152-65535/udp range. A previous, narrower max-port=49252 here
# didn't actually match what the running container allocated from (relay
# candidates were observed going out well past 49252, e.g. 60797) — cause
# unconfirmed, but the firewall has to match whatever coturn really does,
# not just what this file claims, so widen both together if this ever
# changes again (see the 2026-07-31 cross-network black-screen investigation).

# Moved off the home network (see docs/WEBRTC-TURN-DEBUGGING.md) onto a
# dedicated Hostinger VPS — a single public IP with no NAT/private-IP
# duality, so no public/private mapping is needed here anymore.
external-ip=72.62.28.27

realm=bromeoremote.com
lt-cred-mech
user=bromeo:pvyht0ejbJigBjAzTI6IVFJ0GGYVH29h
no-cli
no-tls
no-dtls
