<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BromeoRemote Admin — Inloggen</title>
  <link rel="icon" href="/assets/icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0b1425;
      color: #e8edf5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 3rem;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(20px);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .logo img { height: 36px; }
    .logo span {
      font-size: 0.75rem;
      color: #0be881;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #8898aa; font-size: 0.9rem; margin-bottom: 2rem; }
    label { display: block; font-size: 0.8rem; color: #8898aa; margin-bottom: 0.4rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 0.8rem 1rem;
      color: #e8edf5;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #0be881; }
    button {
      width: 100%;
      background: #0be881;
      color: #0b1425;
      border: none;
      border-radius: 10px;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 0.5rem;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: #ff4d6d; font-size: 0.85rem; margin-top: 0.75rem; text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <img src="/assets/logo2.png" alt="BromeoRemote">
      <span>Admin Panel</span>
    </div>
    <h1>Inloggen</h1>
    <p>Toegang tot het beheerpaneel van BromeoRemote.</p>
    <form id="loginForm">
      <label for="email">E-mailadres</label>
      <input type="email" id="email" name="email" autocomplete="email" required placeholder="info@bromeoremote.com">
      <label for="password">Wachtwoord</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
      <button type="submit" id="loginBtn">Inloggen</button>
      <p class="error" id="loginError" hidden></p>
    </form>
  </div>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const err = document.getElementById("loginError");
      btn.disabled = true;
      btn.textContent = "Bezig...";
      err.hidden = true;
      try {
        const res = await fetch("/admin/api/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = "/admin";
        } else {
          err.textContent = data.error || "Inloggen mislukt.";
          err.hidden = false;
        }
      } catch {
        err.textContent = "Serverfout. Probeer opnieuw.";
        err.hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = "Inloggen";
      }
    });
  </script>
</body>
</html>
