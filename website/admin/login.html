<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BromeoRemote Admin — Inloggen</title>
  <link rel="icon" href="/assets/icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Light Mode (Default) */
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --border-focus: #10b981;
      --input-bg: #f1f5f9;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #10b981;
      --accent-text: #ffffff;
      --danger: #ef4444;
    }
    [data-theme="dark"] {
      /* Dark Mode */
      --bg: #0b1425;
      --card-bg: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.1);
      --border-focus: #0be881;
      --input-bg: rgba(255,255,255,0.06);
      --text: #e8edf5;
      --muted: #8898aa;
      --accent: #0be881;
      --accent-text: #0b1425;
      --danger: #ff4d6d;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(20px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }
    .logo {
      display: flex;
      align-items: center;
      margin-bottom: 2rem;
    }
    .logo img {
      max-width: 100%;
      height: auto;
      max-height: 44px;
      object-fit: contain;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.8rem 1rem;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--border-focus); }
    button {
      width: 100%;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 10px;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 0.5rem;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: var(--danger); font-size: 0.85rem; margin-top: 0.75rem; text-align: center; }
  </style>
  <script>
    let currentTheme = localStorage.getItem('br_admin_theme') || 'light';
    if (currentTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  </script>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <img src="/assets/logo2.png" alt="BromeoRemote">
    </div>
    <h1>Inloggen</h1>
    <p>Toegang tot het beheerpaneel van BromeoRemote.</p>
    <form id="loginForm">
      <label for="email">E-mailadres</label>
      <input type="email" id="email" name="email" autocomplete="email" required placeholder="info@bromeoremote.com">
      <label for="password">Wachtwoord</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
      <button type="submit" id="loginBtn">Inloggen</button>
      <p class="error" id="loginError" hidden></p>
    </form>
  </div>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const err = document.getElementById("loginError");
      btn.disabled = true;
      btn.textContent = "Bezig...";
      err.hidden = true;
      try {
        const res = await fetch("/admin/api/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = "/admin";
        } else {
          err.textContent = data.error || "Inloggen mislukt.";
          err.hidden = false;
        }
      } catch {
        err.textContent = "Serverfout. Probeer opnieuw.";
        err.hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = "Inloggen";
      }
    });
  </script>
</body>
</html>
